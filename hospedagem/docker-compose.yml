# Site VERT4® na Hostinger: vert4comercial.com (site e página /mapa/) e mapa.vert4comercial.com (atalho para /mapa/).
# Serve a versão aprovada (REF = branch ou commit deste repositório). Para publicar outra versão, troque REF no hPanel e reimplante.
services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        wget -q -O /tmp/s.tgz "https://codeload.github.com/alinedayane-cell/vert4-site/tar.gz/$${REF:-publicacao-aprovada}"
        mkdir -p /site && tar -xzf /tmp/s.tgz -C /site --strip-components=1
        test -f /site/dist/index.html && test -f /site/dist/mapa/index.html
        cat > /etc/nginx/conf.d/default.conf <<'CONF'
        server {
          listen 80;
          server_name mapa.vert4comercial.com;
          location = / { return 301 https://vert4comercial.com/mapa/$$is_args$$args; }
          location / { return 301 https://vert4comercial.com/mapa$$request_uri; }
        }
        server {
          listen 80 default_server;
          root /site/dist;
          index index.html;
          add_header X-Content-Type-Options nosniff always;
          add_header Referrer-Policy strict-origin-when-cross-origin always;
          location = /mapa/checkout.html { return 302 https://pay.hotmart.com/R108182137W; }
          location / { try_files $$uri $$uri/ =404; }
        }
        CONF
        exec nginx -g 'daemon off;'
    environment:
      - REF=${REF:-publicacao-aprovada}
    labels:
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`vert4comercial.com`) || Host(`www.vert4comercial.com`) || Host(`mapa.vert4comercial.com`) || Host(`${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=letsencrypt
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80
