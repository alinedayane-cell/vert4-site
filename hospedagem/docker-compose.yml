# Página de vendas do Mapa (mapa.vert4comercial.com): nginx servindo a branch mapa-de-oportunidades deste repositório.
# A cada início e a cada 10 minutos baixa a versão mais recente do GitHub.
services:
  site:
    image: nginx:1.27-alpine
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - |
        baixar() {
          wget -q -O /tmp/s.tgz "https://codeload.github.com/alinedayane-cell/vert4-site/tar.gz/refs/heads/$${BRANCH:-mapa-de-oportunidades}" || return 1
          rm -rf /tmp/n && mkdir -p /tmp/n && tar -xzf /tmp/s.tgz -C /tmp/n --strip-components=1 || return 1
          [ -f /tmp/n/dist/mapa/index.html ] || return 1
          rm -rf /site.old && [ -d /site ] && mv /site /site.old; mv /tmp/n /site
        }
        baixar || echo "download falhou"
        cat > /etc/nginx/conf.d/default.conf <<'CONF'
        server {
          listen 80;
          root /site/dist/mapa;
          index index.html;
          add_header X-Content-Type-Options nosniff always;
          add_header Referrer-Policy strict-origin-when-cross-origin always;
          add_header Strict-Transport-Security "max-age=31536000" always;
          location /assets/ { alias /site/dist/assets/; }
          location = /checkout.html { return 302 https://pay.hotmart.com/R108182137W; }
          location / { try_files $$uri $$uri/ =404; }
        }
        CONF
        (while true; do sleep 600; baixar && nginx -s reload; done) &
        exec nginx -g 'daemon off;'
    ports:
      - "80"
    environment:
      - BRANCH=${BRANCH:-mapa-de-oportunidades}
    labels:
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${DOMINIO:-mapa.vert4comercial.com}`) || Host(`${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=letsencrypt
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80
